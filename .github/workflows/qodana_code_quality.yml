name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: # Specify your branches here
      - main # The 'main' branch
      - 'releases/*' # The release branches

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # to check out the actual pull request commit, not the merge commit
          fetch-depth: 0  # a full history is required for pull request analysis
          path: ploch-commandline

      # Same sibling layout as the Build workflow: without these the analyser cannot resolve any
      # ../ploch-common project reference and reports the solution as unresolved.
      - uses: actions/checkout@v4
        with:
          repository: mrploch/ploch-common
          ref: master
          path: ploch-common
      - uses: actions/checkout@v4
        with:
          repository: mrploch/mrploch-development
          ref: main
          path: mrploch-development
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2024.1
        with:
          pr-mode: false
          args: --project-dir,${{ github.workspace }}/ploch-commandline
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_657107159 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'