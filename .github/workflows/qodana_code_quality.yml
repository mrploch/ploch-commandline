name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: # Specify your branches here
      - main # The 'main' branch
      - 'releases/*' # The release branches

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # to check out the actual pull request commit, not the merge commit
          fetch-depth: 0  # a full history is required for pull request analysis
          path: ploch-commandline
          # The analyser runs in a container that mounts this workspace. Do not leave the job token
          # in .git/config where it could read it: Qodana only needs the local history.
          persist-credentials: false

      # mrploch-development is required for shared build configuration and version files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mrploch/mrploch-development
          ref: main
          path: mrploch-development
          persist-credentials: false
          fetch-depth: 0
      # Qodana mounts only the analysis root into its container, so the analysis root has to be the
      # workspace - otherwise ../mrploch-development sits outside /data and shared files are
      # unresolvable. This step writes the configuration from scratch and does
      # not read the repository's qodana.yaml, which only serves local runs from the repository
      # root. The two are duplicates: keep the profile, inclusions and linter in step by hand, with
      # only the paths rebased onto the workspace layout here.
      #
      # The linter is pinned to a release line rather than `latest`. A linter release can add
      # inspections, and every finding they produce would be reported as new against the baseline
      # (#55). Upgrading the linter is therefore a deliberate change that also refreshes the
      # baseline. Keep this value in step with the repository's qodana.yaml.
      - name: Compose the workspace-level Qodana configuration
        run: |
          cat > qodana.yaml <<'QODANA'
          version: "1.0"
          linter: jetbrains/qodana-cdnet:2026.2
          profile:
            name: qodana.recommended
          include:
            - name: CheckDependencyLicenses
          dotnet:
            solution: ploch-commandline/Ploch.CommandLine.Spectre.slnx
          exclude:
            - name: All
              paths:
                # Qodana for .NET reports result locations relative to the solution directory, not to
                # the analysis root, and matches these paths the same way (#58). The solution-relative
                # form is what excludes the test projects; the workspace-relative one is kept only
                # until a CI run proves which of the two is honoured.
                - tests/**
                - ploch-commandline/tests/**
                - mrploch-development
          QODANA

      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@10be11607eb323a180e2b76b26c9c5cdceac3e77 # v2026.2.1
        with:
          # Report only problems that are not in the committed baseline, and fail on any of them
          # (#55). The path is relative to the analysis root, which is the workspace, not this
          # repository. Both flags live here rather than in qodana.yaml so a local run from the
          # repository root, whose fingerprints cannot match the CI baseline, is not failed by
          # them. How and when to refresh the baseline: .qodana/README.md.
          args: --baseline ploch-commandline/.qodana/baseline.sarif.json --fail-threshold 0
          pr-mode: false
          # Publishes the results directory, zipped, as the `qodana-report` artifact; its
          # qodana.sarif.json is what the committed baseline is refreshed from (see
          # .qodana/README.md).
          upload-result: true
        env:
          # Scoped to this step, not the job (least privilege, raised by the CodeRabbit reviewer
          # on PR #52). Note that the linter runs in its own container and does not currently
          # receive this token, so restores there log GitHub Packages authentication warnings;
          # they still succeed because every Ploch.* package resolves from nuget.org. Forwarding
          # it needs an action release with `env-vars-to-linter` (#57).
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_657107159 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
