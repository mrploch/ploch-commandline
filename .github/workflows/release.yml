name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version to release (e.g. 1.0, 1.1). The patch version is computed automatically by NBGV.'
        required: true
        type: string
      next_version:
        description: 'Next development version after release (e.g. 1.1). Leave empty to auto-increment the minor version.'
        required: false
        type: string
      dry_run:
        description: 'Rehearse the release without publishing anything. Builds, tests, packs, and exchanges the OIDC token, then stops before the tag push, the nuget.org pushes, the GitHub Release and the bookkeeping PRs.'
        required: false
        default: false
        type: boolean
      mrploch_development_ref:
        description: 'Commit SHA or tag of mrploch-development to build against.'
        required: false
        default: '909e070a1aabb59acb4304935ade6dc00b5e456f'
        type: string

env:
  DOTNET_VERSION: '10.0.x'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # Pass workflow inputs via env vars to avoid script injection (githubactions:S7635)
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
      NEXT_VERSION_INPUT: ${{ inputs.next_version }}
    # Every `run` step operates inside the checked-out repository. mrploch-development - the
    # only sibling this workflow still needs - is checked out next to it, reproducing the
    # workspace layout Directory.Packages.props expects.
    defaults:
      run:
        working-directory: ploch-commandline

    steps:
      - name: Validate inputs
        working-directory: .
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::release_version must be in major.minor format (e.g. 1.0) without leading zeros"
            exit 1
          fi
          if [ -n "$NEXT_VERSION_INPUT" ]; then
            if [[ ! "$NEXT_VERSION_INPUT" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::next_version must be in major.minor format (e.g. 1.1) without leading zeros"
              exit 1
            fi
          fi

      - name: Validate mrploch_development_ref input
        working-directory: .
        env:
          MRPLOCH_DEVELOPMENT_REF: ${{ inputs.mrploch_development_ref }}
        run: |
          REF="$MRPLOCH_DEVELOPMENT_REF"
          if [[ ! "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            # Not a full SHA. Check if it's a valid tag.
            TAG_SHA=$(git ls-remote --tags https://github.com/mrploch/mrploch-development.git "refs/tags/$REF" | cut -f1)
            if [ -z "$TAG_SHA" ]; then
              echo "::error::mrploch_development_ref must be a 40-character commit SHA or an existing tag."
              exit 1
            fi
          fi

      - name: Validate NuGet Trusted Publishing configuration
        working-directory: .
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::Repository/organization variable NUGET_USER is not set. It must contain the nuget.org account name (profile name, NOT the email address) that owns the trusted publishing policy."
            exit 1
          fi
          case "$NUGET_USER" in
            *@*)
              echo "::error::NUGET_USER looks like an email address. It must be the nuget.org profile name that owns the trusted publishing policy."
              exit 1
              ;;
          esac
          echo "NuGet Trusted Publishing user: $NUGET_USER"

      # Validate GH_TOKEN early - it is needed later for pushing commits and tags.
      # The default GITHUB_TOKEN cannot trigger subsequent workflows, so a PAT is required.
      - name: Validate GH_TOKEN secret
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GH_TOKEN secret is not set. A Personal Access Token with 'repo' and 'workflow' scopes is required."
            exit 1
          fi
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $GH_TOKEN" \
            https://api.github.com/repos/${{ github.repository }})
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::GH_TOKEN is invalid or expired (HTTP $HTTP_STATUS). Please regenerate the PAT and update the repository secret."
            exit 1
          fi
          echo "GH_TOKEN is valid"

      # Validate GH_PACKAGES_TOKEN too. Assigning it is not the same as having it: an unset or
      # expired secret still leaves nuget.config sending an empty password to the GitHub
      # Packages feed, which 401s and puts the restore back in the NU1301 race described on the
      # job env above - the exact failure the token was added to remove. Fail here, with a
      # readable message, rather than in the middle of a restore.
      # Raised by the Copilot (Grok 4.6) reviewer on PR #52.
      - name: Validate GH_PACKAGES_TOKEN secret
        working-directory: .
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          if [ -z "$GH_PACKAGES_TOKEN" ]; then
            echo "::error::GH_PACKAGES_TOKEN secret is not set. A token with 'read:packages' scope is required so the GitHub Packages feed mapped for Ploch.* in nuget.config can be authenticated."
            exit 1
          fi
          # A presence check is not enough: an expired token, or one without read:packages,
          # is non-empty and still 401s during restore - which is the failure this step
          # exists to pre-empt. So actually authenticate against the feed nuget.config uses.
          # Basic auth with the token as the password is how NuGet presents it.
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}"             -u "x-access-token:$GH_PACKAGES_TOKEN"             https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json)
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::GH_PACKAGES_TOKEN is invalid, expired, or lacks 'read:packages' (HTTP $HTTP_STATUS from the GitHub Packages NuGet index). Regenerate the token and update the repository secret."
            exit 1
          fi
          echo "GH_PACKAGES_TOKEN authenticates against GitHub Packages"

      # Use the default GITHUB_TOKEN for checkout - it always works and has read access.
      # GH_TOKEN (PAT) is configured separately before push steps, because it is the
      # only token that can trigger subsequent workflows when pushing commits.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ploch-commandline
          fetch-depth: 0

      # No ploch-common checkout. The release build consumes ploch-common as released NuGet
      # packages (UsePlochProjectReferences defaults to false), so the sibling sources are not
      # needed - and checking them out at the moving `master` branch is what made this workflow
      # able to pack a stable package with prerelease Ploch.Common dependencies (issue #47).
      # mrploch-development is still required: Directory.Packages.props imports the shared
      # version files from it.

      - name: Checkout mrploch-development (shared build config)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mrploch/mrploch-development
          ref: ${{ inputs.mrploch_development_ref }}
          path: mrploch-development
          fetch-depth: 0

      # Projects resolve $(TargetFrameworkVersion) to net10.0 from mrploch-development/dependencies.
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore .NET tools (nbgv, docfx)
        run: dotnet tool restore

      - name: Configure git
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git

      - name: Set release version
        run: |
          dotnet nbgv set-version "$RELEASE_VERSION"
          echo "Release version set to $RELEASE_VERSION"

      # Use the current HEAD commit timestamp so reruns recreate the same
      # release commit SHA until the release branch state changes.
      - name: Commit release version
        run: |
          RELEASE_COMMIT_TIMESTAMP=$(git show -s --format=%cI HEAD)
          export GIT_AUTHOR_DATE="$RELEASE_COMMIT_TIMESTAMP"
          export GIT_COMMITTER_DATE="$RELEASE_COMMIT_TIMESTAMP"
          git add version.json
          git diff --cached --quiet && echo "version.json unchanged, skipping commit" || \
            git commit -m "chore(release): Set version to $RELEASE_VERSION"

      - name: Get computed NuGet version
        id: version
        run: |
          NUGET_VERSION=$(dotnet nbgv get-version --variable NuGetPackageVersion)
          echo "nuget_version=$NUGET_VERSION" >> $GITHUB_OUTPUT
          echo "NuGet package version: $NUGET_VERSION"

      - name: Restore dependencies
        # Scoped to this step rather than the job, so the package credential is not exposed
        # to checkout, upload, release or other third-party actions (least privilege, raised
        # by the CodeRabbit reviewer on PR #52).
        #
        # nuget.config maps Ploch.* to both nuget.org and the GitHub Packages feed, and the
        # GitHub feed authenticates with %GH_PACKAGES_TOKEN%. Without it, every Ploch restore
        # queries that feed unauthenticated and takes a 401.
        #
        # This is a reliability fix, and the mechanism is worth stating precisely because the
        # obvious reading of it is wrong in both directions. An unauthenticated eligible feed
        # does not reliably fail - a local test with an isolated packages folder and no token
        # warned, retried, fell back to nuget.org and exited 0 - but neither is it merely
        # cosmetic. NuGet queries sources concurrently and a restore succeeds as soon as one
        # supplies the requested version, while a terminal protocol failure from another source
        # is rethrown rather than ignored. Which of those happens first is a race: if the
        # GitHub feed exhausts its retries before nuget.org returns the match, restore can fail
        # with NU1301 even though the package exists on nuget.org. One green run is a sample of
        # that race, not proof it cannot go the other way.
        #
        # It is also load-bearing, not just defensive: prerelease Ploch builds exist ONLY on the
        # GitHub feed, so the moment the shared Ploch.Packages.props names a prerelease the
        # nuget.org fallback finds nothing and restore fails hard with NU1103.
        #
        # It does NOT fix that for pull requests from forks - GitHub does not expose repository
        # secrets to fork PRs at all, so no workflow can authenticate for them. Tracked in #54.
        #
        # Raised by four PR reviewers (codeant-ai, qodo, copilot, chatgpt-codex) and sharpened
        # by the Codex and Antigravity reviewers on PR #52.
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: dotnet restore ./Ploch.CommandLine.Spectre.slnx

      - name: Build (Release)
        run: dotnet build ./Ploch.CommandLine.Spectre.slnx --no-restore -c Release

      - name: Test
        run: dotnet test ./Ploch.CommandLine.Spectre.slnx --no-build -c Release --verbosity normal --logger "trx;LogFileName=TestOutputResults.trx" /p:CollectCoverage=true /p:CoverletOutput=./CoverageResults/ "/p:CoverletOutputFormat=cobertura%2copencover"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-test-results
          path: |
            ploch-commandline/**/TestResults/*.xml
            ploch-commandline/**/TestResults/*.trx

      - name: Pack release artifacts
        if: success()
        run: dotnet pack ./Ploch.CommandLine.Spectre.slnx --no-build -c Release -o "$RUNNER_TEMP/packages"

      - name: Build and test the SampleApp against the packed packages
        if: success()
        env:
          NUGET_VERSION: ${{ steps.version.outputs.nuget_version }}
        run: |
          set -euo pipefail
          SAMPLE="samples/SampleApp/Ploch.CommandLine.Spectre.SampleApp.slnx"
          if [ ! -f "$SAMPLE" ]; then
            echo "::warning::Sample app not found at $SAMPLE. Skipping verification."
            exit 0
          fi
          
          CONFIG=$(mktemp)
          GPF=$(mktemp -d)
          {
            echo '<?xml version="1.0" encoding="utf-8"?>'
            echo '<configuration>'
            echo '  <config>'
            echo "    <add key=\"globalPackagesFolder\" value=\"$GPF\" />"
            echo '  </config>'
            echo '  <packageSources>'
            echo '    <clear />'
            echo "    <add key=\"local\" value=\"$RUNNER_TEMP/packages\" />"
            echo '    <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />'
            echo '  </packageSources>'
            echo '  <packageSourceMapping>'
            echo '    <packageSource key="local">'
            echo '      <package pattern="Ploch.CommandLine.*" />'
            echo '    </packageSource>'
            echo '    <packageSource key="nuget.org">'
            echo '      <package pattern="*" />'
            echo '    </packageSource>'
            echo '  </packageSourceMapping>'
            echo '</configuration>'
          } > "$CONFIG"

          echo "Restoring and building SampleApp against generated packages..."
          dotnet restore "$SAMPLE" --configfile "$CONFIG" -p:UsePlochProjectReferences=false -p:PlochPackagesVersion="$NUGET_VERSION"
          dotnet build "$SAMPLE" --no-restore -c Release -p:UsePlochProjectReferences=false -p:PlochPackagesVersion="$NUGET_VERSION"
          dotnet test "$SAMPLE" --no-build -c Release -p:UsePlochProjectReferences=false -p:PlochPackagesVersion="$NUGET_VERSION"

      # Tag is created BEFORE publishing packages intentionally.
      # Rationale: orphaned packages on NuGet.org cannot be deleted (only unlisted),
      # while tags can be deleted and re-created easily. Tag-first is the safer default.
      # Retry-safe: re-uses an existing tag if it already points at HEAD.
      - name: Create and push tag
        id: tag
        if: success() && inputs.dry_run != true
        run: |
          NUGET_VERSION="${{ steps.version.outputs.nuget_version }}"
          TAG="v${NUGET_VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, verifying it points to HEAD"
            EXISTING=$(git rev-parse "$TAG^{}")
            CURRENT=$(git rev-parse HEAD)
            if [ "$EXISTING" != "$CURRENT" ]; then
              echo "::error::Tag $TAG exists but points to a different commit. Delete it manually to retry."
              exit 1
            fi
            echo "Tag $TAG already points to HEAD, reusing it"
          else
            git tag -a "$TAG" -m "Release ${NUGET_VERSION}"
            git push origin "$TAG"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # Authenticate via OIDC to obtain a short-lived API key.
      # This runs even on dry_run to verify the Trusted Publishing configuration is correct.
      - name: Authenticate to NuGet.org via Trusted Publishing (OIDC)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish NuGet packages to NuGet.org
        if: success() && inputs.dry_run != true
        env:
          NUGET_PUSH_TOKEN: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          SYMBOLS_REQUIRED: true
        run: bash .github/scripts/publish-nuget-packages.sh --dir "$RUNNER_TEMP/packages" https://api.nuget.org/v3/index.json

      - name: Verify the published packages are resolvable from nuget.org
        if: ${{ !cancelled() && inputs.dry_run != true }}
        continue-on-error: true
        env:
          NUGET_VERSION: ${{ steps.version.outputs.nuget_version }}
        run: |
          set -euo pipefail
          MISSING=""
          COUNT=0
          if ! PKGS=$(bash .github/scripts/publish-nuget-packages.sh --list --dir "$RUNNER_TEMP/packages"); then
            echo "::error::No packages found."
            exit 1
          fi
          for FILE in $PKGS; do
            [ -e "$FILE" ] || continue
            BASE=$(basename "$FILE" .nupkg)
            ID="${BASE%.$NUGET_VERSION}"
            if [ "$ID" = "$BASE" ]; then
              echo "::warning::Could not derive an id from ${BASE} at ${NUGET_VERSION}; skipping."
              continue
            fi
            COUNT=$((COUNT + 1))
            FOUND=""
            for ATTEMPT in 1 2 3 4 5 6; do
              if curl -sf "https://api.nuget.org/v3-flatcontainer/$(echo "$ID" | tr '[:upper:]' '[:lower:]')/index.json" 2>/dev/null | grep -qi "\"$NUGET_VERSION\""; then
                FOUND="yes"
                break
              fi
              echo "  ${ID} not indexed yet (attempt ${ATTEMPT}/6); waiting 30s."
              sleep 30
            done
            if [ -n "$FOUND" ]; then
              echo "  OK      ${ID} ${NUGET_VERSION}"
            else
              echo "  MISSING ${ID} ${NUGET_VERSION}"
              MISSING="${MISSING} ${ID}"
            fi
          done

          if [ -n "$MISSING" ]; then
            echo "::warning::Pushed but not resolvable from nuget.org after ~3 minutes:${MISSING}. Usually catalogue lag; if it persists, the release is PARTIAL."
            {
              echo "### Publish verification incomplete"
              echo
              echo "These ids were pushed but were not resolvable from nuget.org within ~3 minutes:"
              echo
              for ID in $MISSING; do echo "- \`${ID}\` ${NUGET_VERSION}"; done
              echo
              echo "This is usually indexing lag. Re-check on nuget.org before announcing the release, and do not re-run the workflow to 'fix' it - the publish steps are not idempotent."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$COUNT" -gt 0 ]; then
            echo "All ${COUNT} published package(s) are resolvable from nuget.org."
          else
            echo "::warning::No packages were found to verify."
            exit 0
          fi

      - name: Dry run summary
        if: success() && inputs.dry_run == true
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          NUGET_VERSION: ${{ steps.version.outputs.nuget_version }}
        run: |
          set -euo pipefail
          if [ -z "${NUGET_API_KEY}" ]; then
            echo "::error::Trusted Publishing returned an EMPTY key. A real release would have failed at the push. Check that the nuget.org policy names this repository and the workflow file release.yml, with a blank environment."
            exit 1
          fi
          echo "OIDC token exchange succeeded: nuget.org issued a key of ${#NUGET_API_KEY} characters."

          if ! PKGS=$(bash .github/scripts/publish-nuget-packages.sh --list --dir "$RUNNER_TEMP/packages"); then
            echo "::error::No .nupkg files were produced."
            exit 1
          fi
          {
            echo "### Dry Run Complete"
            echo "This was a dry run. The OIDC token exchange with nuget.org was successful, but **nothing was published** and **no tag was created**."
            echo ""
            echo "The following packages WOULD have been pushed:"
            for pkg in $PKGS; do
              echo "- \`$(basename "$pkg")\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record dependency versions
        if: success()
        run: |
          SHA=$(git -C ../mrploch-development rev-parse HEAD)
          {
            echo "### Build Configuration"
            echo ""
            echo "Built against \`mrploch-development\` at commit \`${SHA}\`."
            echo ""
            echo "#### Resolved Ploch Dependencies"
            echo '```text'
            dotnet list ./Ploch.CommandLine.Spectre.slnx package | grep -i 'Ploch\.' | sed 's/^[ \t]*//;s/[ \t]*$//' | awk '!seen[$0]++' || echo "None found"
            echo '```'
          } > /tmp/versions.md
          cat /tmp/versions.md >> "$GITHUB_STEP_SUMMARY"

      # Generate release notes BEFORE archiving change-log entries,
      # so only the current release's entries are included.
      - name: Generate release notes
        id: release-notes
        if: success()
        env:
          NUGET_VERSION: ${{ steps.version.outputs.nuget_version }}
        run: |
          # README.md documents the change-log folder itself and is deliberately excluded:
          # a plain *.md glob would concatenate its worked examples into every release's notes.
          NOTES=""
          if [ -d "change-log" ]; then
            NOTES=$(find change-log -maxdepth 1 -type f -name '*.md' ! -name 'README.md' -print0                     | sort -z | xargs -0 -r cat)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Release ${NUGET_VERSION}"
          fi
          {
            echo "$NOTES"
            echo ""
            echo "---"
            echo ""
            echo "## NuGet Packages"
            echo ""
            echo "All packages are available on [NuGet.org](https://www.nuget.org/profiles/mrploch) with version \`${NUGET_VERSION}\`."
            echo ""
            echo "Install via:"
            echo '```bash'
            echo "dotnet add package Ploch.CommandLine.Spectre --version ${NUGET_VERSION}"
            echo '```'
            echo ""
            cat /tmp/versions.md
          } > /tmp/release-notes.md

      - name: Create GitHub Release
        id: release
        if: success() && inputs.dry_run != true
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Release ${{ steps.version.outputs.nuget_version }}"
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: false

      - name: Verify the GitHub release is published
        if: ${{ always() && steps.tag.outputs.tag != '' && steps.release.outcome != 'skipped' && inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if ! IS_DRAFT=$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq '.isDraft' 2>"$RUNNER_TEMP/gh-release-view.err"); then
            LOOKUP_ERROR=$(cat "$RUNNER_TEMP/gh-release-view.err")
            DRAFT_FLAG=$(gh api "repos/$REPO/releases" --paginate --jq ".[] | select(.tag_name==\"$TAG\") | .draft" || true)
            if [ "$DRAFT_FLAG" = "true" ]; then
              echo "::error title=Release left as a draft::Release $TAG exists but is still a draft. The NuGet packages for this version are already public. Re-run this workflow to publish the draft, or publish it manually from the Releases page."
              exit 1
            fi
            echo "::error title=Release lookup failed::Could not read the GitHub release for tag $TAG. gh reported: ${LOOKUP_ERROR:-<no output>}. If the NuGet packages for this version were already published, verify the release manually or re-run this workflow."
            exit 1
          fi
          if [ "$IS_DRAFT" != "false" ]; then
            echo "::error title=Release left as a draft::Release $TAG exists but is still a draft (isDraft=$IS_DRAFT). The NuGet packages for this version are already public. Re-run this workflow to publish the draft, or publish it manually from the Releases page."
            exit 1
          fi
          echo "Release $TAG is published (isDraft=false)."

      - name: Compute next development version
        id: next
        if: success()
        run: |
          NEXT="$NEXT_VERSION_INPUT"
          if [ -z "$NEXT" ]; then
            MAJOR=$(echo "$RELEASE_VERSION" | cut -d. -f1)
            MINOR=$(echo "$RELEASE_VERSION" | cut -d. -f2)
            NEXT="$MAJOR.$((MINOR + 1))"
          fi
          echo "next_version=$NEXT" >> $GITHUB_OUTPUT
          echo "Next development version: $NEXT-prerelease"

      - name: Set next development version
        if: success()
        env:
          NEXT_DEV_VERSION: ${{ steps.next.outputs.next_version }}
        run: dotnet nbgv set-version "${NEXT_DEV_VERSION}-prerelease"

      - name: Archive consumed change-log entries
        if: success() && inputs.dry_run != true
        run: |
          # Same exclusion as the notes step: archiving README.md would delete the folder's
          # own documentation on the first release.
          if [ -d "change-log" ]; then
            ENTRIES=$(find change-log -maxdepth 1 -type f -name '*.md' ! -name 'README.md')
            if [ -n "$ENTRIES" ]; then
              mkdir -p change-log/archive
              find change-log -maxdepth 1 -type f -name '*.md' ! -name 'README.md' -print0                 | xargs -0 -r -I{} mv {} change-log/archive/
            fi
          fi

      # Idempotent commit: only commit if there are staged changes
      - name: Commit and push next development version
        if: success() && inputs.dry_run != true
        env:
          NEXT_DEV_VERSION: ${{ steps.next.outputs.next_version }}
          RELEASED_VERSION: ${{ steps.version.outputs.nuget_version }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git add version.json
          git add change-log/ || true
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "chore(release): Bump version to ${NEXT_DEV_VERSION}-prerelease after ${RELEASED_VERSION}"
          
          BRANCH="chore/post-release-${RELEASED_VERSION}"
          REMOTE_SHA=$(git ls-remote origin "refs/heads/${BRANCH}" | cut -f1)
          if [ -n "$REMOTE_SHA" ]; then
            git push --force-with-lease="refs/heads/${BRANCH}:${REMOTE_SHA}" origin "HEAD:refs/heads/${BRANCH}"
          else
            git push origin "HEAD:refs/heads/${BRANCH}"
          fi

          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty' || true)
          if [ -n "$EXISTING" ]; then
            echo "Pull request #${EXISTING} was already open for ${BRANCH}; it now carries the update."
          else
            BODY=$(printf '%s\n' \
              "Post-release bookkeeping for **${RELEASED_VERSION}**, opened automatically by the release workflow." \
              "" \
              "- \`version.json\` bumped to \`${NEXT_DEV_VERSION}-prerelease\`" \
              "- Consumed \`change-log/*.md\` entries moved into \`change-log/archive/\`" \
              "" \
              "This arrives as a pull request rather than a direct push because branch protection requires one.")
            if PR_URL=$(gh pr create \
                 --base main \
                 --head "$BRANCH" \
                 --title "chore(release): Bump version to ${NEXT_DEV_VERSION}-prerelease after ${RELEASED_VERSION}" \
                 --body "$BODY"); then
              echo "Opened ${PR_URL}"
            else
              echo "::error::Could not open a pull request. Branch $BRANCH has been pushed. Open it manually: gh pr create --base main --head $BRANCH"
              exit 1
            fi
          fi
